[profile.default]
src = "src"
out = "out"
libs = ["lib", "../node_modules", "node_modules"]
test = "test"
script = "script"
solc_version = "0.8.20"
evm_version = "istanbul"
optimizer = true
optimizer_runs = 200

[fmt]
line_length = 100
tab_width = 4
bracket_spacing = true

[rpc_endpoints]
bite_sandbox = "${RPC_URL}"
